services:
  api:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    volumes:
      - payloadx_data:/app/data
      - payloadx_uploads:/app/uploads
    environment:
      DATABASE_URL: sqlite:////app/data/payloadx.db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  payloadx_data:
  payloadx_uploads:
