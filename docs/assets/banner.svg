<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">PayloadX 网络流量载荷提取与调查控制台</title>
  <desc id="desc">深色网络取证工作台风格横幅，展示从抓包到证据研判的分析流程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061018"/>
      <stop offset="0.56" stop-color="#081923"/>
      <stop offset="1" stop-color="#0A242A"/>
    </linearGradient>
    <linearGradient id="brand" x1="74" y1="108" x2="132" y2="172" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0F9F92"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#2DD4BF" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1060 168) rotate(180) scale(470 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6" stop-opacity="0.2"/>
      <stop offset="0.52" stop-color="#0EA5A4" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0EA5A4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#B6E8E3" stroke-opacity="0.035"/>
      <circle cx="0" cy="0" r="1" fill="#D5FFFA" fill-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="canvasClip">
      <rect width="1280" height="360" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#background)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>
  <rect y="1" width="1280" height="2" fill="url(#hairline)" clip-path="url(#canvasClip)"/>

  <g opacity="0.55">
    <path d="M690 46H754" stroke="#5EEAD4" stroke-opacity="0.34"/>
    <path d="M722 30V62" stroke="#5EEAD4" stroke-opacity="0.18"/>
    <circle cx="722" cy="46" r="3" fill="#5EEAD4"/>
  </g>

  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="72" y="50" width="238" height="30" rx="15" fill="#0A282D" stroke="#1A5052"/>
    <circle cx="91" cy="65" r="4" fill="#2DD4BF"/>
    <circle cx="91" cy="65" r="9" fill="#2DD4BF" fill-opacity="0.16" filter="url(#softGlow)"/>
    <text x="105" y="69" fill="#91EDE1" font-size="11" font-weight="600" letter-spacing="1.35">NETWORK EVIDENCE WORKSPACE</text>

    <rect x="72" y="108" width="62" height="62" rx="17" fill="#0B1C24" stroke="#1B4147"/>
    <rect x="81" y="117" width="44" height="44" rx="12" fill="url(#brand)"/>
    <path d="M91 130H115M91 139H108M91 148H113" stroke="#052029" stroke-width="4" stroke-linecap="round"/>
    <circle cx="116" cy="151" r="7" fill="#D5FFF8"/>
    <path d="M113 151H119M116 148V154" stroke="#0C7F77" stroke-width="1.8" stroke-linecap="round"/>

    <text x="154" y="153" fill="#F4FBFA" font-size="48" font-weight="700" letter-spacing="-1.4">PayloadX</text>
    <text x="72" y="214" fill="#D8E9E8" font-size="22" font-weight="500">流量应用载荷提取与调查控制台</text>
    <text x="72" y="246" fill="#7F9DA0" font-size="15">将离线 PCAP 转换为可检索、可审计的证据链</text>

    <g font-family="Consolas, 'SFMono-Regular', monospace" font-size="11" font-weight="600" letter-spacing="0.8">
      <rect x="72" y="282" width="93" height="30" rx="8" fill="#0A2028" stroke="#173C43"/>
      <text x="82" y="301" fill="#8FE8DD">01  CAPTURE</text>
      <path d="M173 297H189" stroke="#31545A"/>
      <path d="M185 293L189 297L185 301" stroke="#31545A" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="198" y="282" width="87" height="30" rx="8" fill="#0A2028" stroke="#173C43"/>
      <text x="216" y="301" fill="#8FE8DD">02  PARSE</text>
      <path d="M293 297H309" stroke="#31545A"/>
      <path d="M305 293L309 297L305 301" stroke="#31545A" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="318" y="282" width="103" height="30" rx="8" fill="#0A2028" stroke="#173C43"/>
      <text x="335" y="301" fill="#8FE8DD">03  EXTRACT</text>
      <path d="M429 297H445" stroke="#31545A"/>
      <path d="M441 293L445 297L441 301" stroke="#31545A" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="454" y="282" width="94" height="30" rx="8" fill="#0D2E31" stroke="#24726E"/>
      <text x="472" y="301" fill="#C2FFF5">04  REVIEW</text>
    </g>
  </g>

  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="812" y="40" width="396" height="280" rx="22" fill="#07131B" fill-opacity="0.94" stroke="#1B3C42"/>
    <rect x="813" y="41" width="394" height="278" rx="21" stroke="#B4FFF4" stroke-opacity="0.035"/>
    <path d="M812 95H1208" stroke="#19343A"/>
    <circle cx="842" cy="68" r="4" fill="#2B5559"/>
    <circle cx="858" cy="68" r="4" fill="#2B5559"/>
    <circle cx="874" cy="68" r="4" fill="#2DD4BF"/>
    <text x="895" y="72" fill="#78989B" font-size="11" font-weight="600" letter-spacing="1.25">ANALYSIS PIPELINE</text>
    <rect x="1118" y="56" width="64" height="24" rx="12" fill="#0C302F" stroke="#1A5753"/>
    <circle cx="1133" cy="68" r="3.5" fill="#34D399"/>
    <text x="1143" y="72" fill="#9DE9D8" font-size="10" font-weight="700" letter-spacing="0.7">LIVE</text>

    <path d="M848 121V289" stroke="#1B484A"/>

    <g font-family="Consolas, 'SFMono-Regular', monospace">
      <rect x="828" y="108" width="364" height="42" rx="10" fill="#0A1D25"/>
      <circle cx="848" cy="129" r="6" fill="#0A1D25" stroke="#2DD4BF" stroke-width="2"/>
      <circle cx="848" cy="129" r="2" fill="#5EEAD4"/>
      <text x="868" y="125" fill="#557A7D" font-size="9" font-weight="700" letter-spacing="1">01</text>
      <text x="868" y="139" fill="#D6E9E8" font-size="12" font-weight="700" letter-spacing="0.8">INGEST</text>
      <text x="1168" y="133" fill="#72DCCF" font-size="10" font-weight="600" text-anchor="end">PCAP VERIFIED</text>

      <rect x="828" y="157" width="364" height="42" rx="10" fill="#091A22"/>
      <circle cx="848" cy="178" r="6" fill="#091A22" stroke="#3B7C7E" stroke-width="2"/>
      <circle cx="848" cy="178" r="2" fill="#67E8F9"/>
      <text x="868" y="174" fill="#557A7D" font-size="9" font-weight="700" letter-spacing="1">02</text>
      <text x="868" y="188" fill="#D6E9E8" font-size="12" font-weight="700" letter-spacing="0.8">REASSEMBLE</text>
      <text x="1168" y="182" fill="#739CA1" font-size="10" font-weight="600" text-anchor="end">842 STREAMS</text>

      <rect x="828" y="206" width="364" height="42" rx="10" fill="#091A22"/>
      <circle cx="848" cy="227" r="6" fill="#091A22" stroke="#3B7C7E" stroke-width="2"/>
      <circle cx="848" cy="227" r="2" fill="#67E8F9"/>
      <text x="868" y="223" fill="#557A7D" font-size="9" font-weight="700" letter-spacing="1">03</text>
      <text x="868" y="237" fill="#D6E9E8" font-size="12" font-weight="700" letter-spacing="0.8">EXTRACT</text>
      <text x="1168" y="231" fill="#739CA1" font-size="10" font-weight="600" text-anchor="end">136 PAYLOADS</text>

      <rect x="828" y="255" width="364" height="49" rx="10" fill="#0B282C" stroke="#1D5655"/>
      <circle cx="848" cy="279" r="7" fill="#103838" stroke="#5EEAD4" stroke-width="2"/>
      <path d="M845 279L847.5 281.5L852 276.5" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="868" y="275" fill="#69AAA8" font-size="9" font-weight="700" letter-spacing="1">04</text>
      <text x="868" y="290" fill="#E4FFFA" font-size="12" font-weight="700" letter-spacing="0.8">REVIEW</text>
      <text x="1168" y="284" fill="#9CF3E4" font-size="10" font-weight="700" text-anchor="end">EVIDENCE READY</text>
    </g>
  </g>

  <text x="1208" y="340" fill="#5A7C7E" font-family="Consolas, 'SFMono-Regular', monospace" font-size="9" letter-spacing="1.2" text-anchor="end">LOCAL-FIRST / AUDITABLE / EXTENSIBLE</text>
</svg>
